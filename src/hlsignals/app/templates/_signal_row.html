<tr>
  <td><b>{{ s.symbol.coin }}</b> <span class="muted mono">{{ s.symbol }}</span></td>
  <td class="{{ s.direction.value if s.direction else '' }}">{{ s.direction.value if s.direction else '-' }}</td>
  <td class="num">{{ s.score|score }}</td>
  {% for name in ('tilt', 'flow', 'overnight') %}
  <td class="num">{{ s.components[name].value|score if name in s.components else '-' }}</td>
  {% endfor %}
  <td class="num">{{ s.n_wallets }}</td>
  <td>{{ s|flags }}</td>
</tr>
