# Instrument catalog: asset class of every live HIP-3 market (docs/api-notes.md §1).
#
# The Hyperliquid API exposes no asset-class metadata, so this catalog is the only way to
# tell a security from a crypto-derived market. Rules:
#   - A symbol absent from this file is UNCLASSIFIED: excluded from signals and reported
#     in diagnostics. Nothing is ever guessed at runtime.
#   - `unverified` = listed on HIP-3 but the underlying was not confirmed; excluded until a
#     human moves it to a real class.
#   - `crypto` entries are HIP-3 markets whose underlying is crypto (never signalled).
#   - Which classes produce signals is set by [universe].include_classes in the app config.
#
# Snapshot: live (non-delisted) markets on 2026-09-24. Re-check with
#   pytest tests/phase0/test_instrument_catalog.py   (after recapturing fixtures)

