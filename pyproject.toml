[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hl-whale-signals"
version = "0.1.0"
description = "Swing-trade signal generator for US equities from Hyperliquid HIP-3 equity perps. Signals only."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pylint>=3.2",
]

[project.scripts]
hlsignals = "hlsignals.app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hlsignals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --strict-markers"
markers = ["live: hits the real Hyperliquid API (excluded by default)"]

[tool.coverage.run]
branch = true
source = ["hlsignals"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "PT", "DTZ", "T20"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
"scripts/**" = ["T20"]
"src/hlsignals/app/cli.py" = ["T20"]  # the CLI's output is its product

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests", "scripts"]
